# ══════════════════════════════════════════════════════════════════════
# SMART-INFRA AI — DOCKER COMPOSE ORCHESTRATION
# Full-Stack Municipal AI Infrastructure Platform
# ══════════════════════════════════════════════════════════════════════

services:
  # ── MySQL 8.0 Relational Database Engine ──
  db:
    image: mysql:8.0
    container_name: smart-infra-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: Password@123
      MYSQL_DATABASE: smart_infra
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smart-infra-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pPassword@123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── FastAPI Backend & AI Computer Vision Engine ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smart-infra-backend:latest
    container_name: smart-infra-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=mysql+pymysql://root:Password%40123@db:3306/smart_infra
      - CORS_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173,http://frontend
    volumes:
      # Persistent storage for uploads, detections, and logs
      - ./backend/uploads:/app/uploads
      - ./backend/detections:/app/detections
      - ./backend/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smart-infra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

  # ── React + Vite Frontend (Served via Nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: smart-infra-frontend:latest
    container_name: smart-infra-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smart-infra-network

volumes:
  mysql_data:
    driver: local

networks:
  smart-infra-network:
    driver: bridge
