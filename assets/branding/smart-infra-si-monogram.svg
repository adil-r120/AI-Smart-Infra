<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <radialGradient id="siBgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- 'S' Gradient: Electric Cyan to Vivid Azure -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#0066EE" />
    </linearGradient>

    <!-- 'I' Gradient: Smart Infrastructure Teal Cyan -->
    <linearGradient id="iGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D" />
      <stop offset="100%" stop-color="#11998E" />
    </linearGradient>

    <!-- Subtle Glow for Digital Presentation -->
    <filter id="siGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00F5FF" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="64" fill="url(#siBgGrad)" />

  <!-- Monogram Mark (Combination of S and I) -->
  <g transform="translate(18, -12)" filter="url(#siGlow)">
    <!-- Letter 'S' - Dynamic High-Speed Geometric Curve -->
    <!-- Top Arc of S -->
    <path d="M 270 120
             L 165 120
             C 115 120, 80 155, 80 205
             C 80 255, 120 280, 185 295
             L 245 310
             C 275 318, 290 335, 290 355
             C 290 380, 265 400, 220 400
             L 110 400
             L 110 360
             L 215 360
             C 235 360, 248 350, 248 335
             C 248 315, 220 300, 160 285
             L 115 275
             C 65 260, 38 230, 38 185
             C 38 135, 80 95, 145 95
             L 270 95
             Z"
          fill="url(#sGrad)" />

    <!-- Letter 'I' - Architectural Pillar & Sensor Node -->
    <!-- Top Sensor Node of I -->
    <circle cx="370" cy="115" r="22" fill="#00F5FF" />
    
    <!-- Vertical Pillar of I -->
    <rect x="348" y="155" width="44" height="245" rx="14" fill="url(#sGrad)" />

    <!-- Connecting Data Bridge / Telemetry Beam between S and I -->
    <rect x="250" y="240" width="105" height="12" rx="6" fill="#00F5FF" opacity="0.8" />
    <circle cx="300" cy="246" r="6" fill="#38EF7D" />
  </g>

  <!-- Wordmark Text -->
  <text x="256" y="448" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#FFFFFF" 
        text-anchor="middle">
    SMART<tspan fill="#00F5FF">-INFRA</tspan>
  </text>
  <text x="256" y="474" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-size="11" 
        font-weight="600" 
        letter-spacing="6" 
        fill="#94A3B8" 
        text-anchor="middle">
    S · I  MONOGRAM MARK
  </text>
</svg>
