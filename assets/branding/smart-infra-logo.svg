<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Top Loop Gradient: Cyan to Royal Blue -->
    <linearGradient id="topArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="60%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#0052D4" />
    </linearGradient>

    <!-- Bottom Loop Gradient: Electric Blue to Teal Cyan -->
    <linearGradient id="bottomArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="45%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#48CAE4" />
    </linearGradient>

    <!-- Inner Ribbon Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>

    <!-- Subtle Drop Glow Filter for Presentation -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00B4D8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)" />

  <!-- Logo Mark Group -->
  <g transform="translate(0, -10)" filter="url(#glow)">
    <!-- Top Arc ribbon -->
    <path d="M 330 110
             C 210 110, 150 165, 150 230
             C 150 280, 195 315, 270 330
             L 285 300
             C 230 288, 195 265, 195 230
             C 195 190, 235 155, 330 155
             C 385 155, 415 185, 415 220
             L 460 210
             C 460 150, 410 110, 330 110 Z"
          fill="url(#topArcGrad)" />

    <!-- Bottom Arc ribbon -->
    <path d="M 182 402
             C 302 402, 362 347, 362 282
             C 362 232, 317 197, 242 182
             L 227 212
             C 282 224, 317 247, 317 282
             C 317 322, 277 357, 182 357
             C 127 357, 97 327, 97 292
             L 52 302
             C 52 362, 102 402, 182 402 Z"
          fill="url(#bottomArcGrad)" />

    <!-- Interlocking Center Energy Link -->
    <path d="M 235 235
             C 240 220, 272 220, 277 235
             L 290 277
             C 285 292, 253 292, 248 277 Z"
          fill="url(#accentGrad)"
          opacity="0.9" />

    <!-- Smart Edge Infrastructure Node Dots -->
    <circle cx="438" cy="215" r="7" fill="#00F5FF" />
    <circle cx="74" cy="297" r="7" fill="#48CAE4" />
  </g>

  <!-- Wordmark Text -->
  <text x="256" y="452" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#FFFFFF" 
        text-anchor="middle">
    SMART<tspan fill="#00F5FF">-INFRA</tspan>
  </text>
</svg>
